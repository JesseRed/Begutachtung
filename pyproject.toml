[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "begutachtung"
version = "0.2.0"
description = "OCR-Pipeline für gescannte medizinische Begutachtungs-Akten"
requires-python = ">=3.10"
dependencies = [
    "pypdf>=4.2.0",
    "pymupdf>=1.24",
    "typer>=0.12",
    "pyyaml>=6.0",
    "rapidfuzz>=3.9",
]

[project.optional-dependencies]
ui = ["fastapi>=0.115", "uvicorn>=0.30", "jinja2>=3.1", "python-multipart>=0.0.12"]
dev = ["pytest>=8.0"]

[project.scripts]
begutachtung = "begutachtung.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
