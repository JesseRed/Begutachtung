# conda env create -f environment.yml && conda activate ocr_env
#
# Die eigentliche OCR laeuft im Docker-Image jbarlow83/ocrmypdf, nicht hier.
# Diese Umgebung deckt nur die PDF-Manipulation auf dem Host ab.
name: ocr_env
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - pip:
      - pypdf>=4.2.0     # extractor.py, rotate_pdf.py
      - pymupdf>=1.24    # Rasterung und Textlayer (ab Phase 2)
